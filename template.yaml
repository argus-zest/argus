AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Argus — Delhi Street Hazard Intelligence & Civic Accountability Platform

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  FrontendOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Allowed origin for CORS
  SesFrom:
    Type: String
    Description: Verified SES email identity for sending notices
  DryRunInbox:
    Type: String
    Description: Verified SES email identity for receiving dry-run notices
  NovaModelId:
    Type: String
    Default: 'amazon.nova-lite-v1:0'
    AllowedValues: ['amazon.nova-lite-v1:0']
    Description: Regional Amazon Bedrock Nova Lite model ID (in-Region inference only)
  EnableTomtom:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable optional TomTom traffic integration
  TomtomApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional API key for TomTom flow segment data

Conditions:
  HasAdditionalFrontendOrigin: !Not
    - !Equals [!Ref FrontendOrigin, 'http://localhost:5173']

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 15
    MemorySize: 512
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        TABLE_ASSETS: !Ref AssetsTable
        TABLE_CASES: !Ref CasesTable
        TABLE_EVENTS: !Ref CaseEventsTable
        BUCKET: !Ref StorageBucket
        NOVA_MODEL_ID: !Ref NovaModelId
        SES_FROM: !Ref SesFrom
        DRYRUN_INBOX: !Ref DryRunInbox
        USE_MOCKS: 'false'
        ENABLE_TOMTOM: !Ref EnableTomtom
        TOMTOM_API_KEY: !Ref TomtomApiKey

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - !If [HasAdditionalFrontendOrigin, 'http://localhost:5173', !Ref 'AWS::NoValue']
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 3000
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: argus-shared-layer
      Description: Shared Python modules and civic datasets
      ContentUri: backend/layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Case photo keys remain under uploads/; do not expire evidence automatically.
    Properties:
      BucketName: !Sub 'argus-${AWS::AccountId}-ap-southeast-2'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - !Ref FrontendOrigin
              - !If [HasAdditionalFrontendOrigin, 'http://localhost:5173', !Ref 'AWS::NoValue']
            MaxAge: 3000

  StorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureApplicationTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt StorageBucket.Arn
              - !Sub '${StorageBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
                aws:PrincipalIsAWSService: 'false'

  AssetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Preserve case history and civic data on deletion or replacement.
    Properties:
      TableName: !Sub '${AWS::StackName}-Assets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: asset_id
          AttributeType: S
      KeySchema:
        - AttributeName: asset_id
          KeyType: HASH

  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Preserve case history and civic data on deletion or replacement.
    Properties:
      TableName: !Sub '${AWS::StackName}-Cases'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
      KeySchema:
        - AttributeName: case_id
          KeyType: HASH

  CaseEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Preserve case history and civic data on deletion or replacement.
    Properties:
      TableName: !Sub '${AWS::StackName}-CaseEvents'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
        - AttributeName: ts_seq
          AttributeType: S
      KeySchema:
        - AttributeName: case_id
          KeyType: HASH
        - AttributeName: ts_seq
          KeyType: RANGE

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/health/
      Handler: app.handler
      Role: !GetAtt HealthFunctionRole.Arn
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/health
            Method: GET

  HotspotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/hotspots/
      Handler: app.handler
      Role: !GetAtt HotspotsFunctionRole.Arn
      Events:
        HotspotsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/hotspots
            Method: GET
        ResolveApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/resolve
            Method: POST

  RiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/risk/
      Handler: app.handler
      Role: !GetAtt RiskFunctionRole.Arn
      Events:
        RiskApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/risk
            Method: GET

  AssetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/assets/
      Handler: app.handler
      Role: !GetAtt AssetsFunctionRole.Arn
      Events:
        AssetsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/assets
            Method: GET

  EvalResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/eval_results/
      Handler: app.handler
      Role: !GetAtt EvalResultsFunctionRole.Arn
      Events:
        EvalResultsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/eval/results
            Method: GET

  ScheduledScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/scheduled_score/
      Handler: app.handler
      Timeout: 60
      Role: !GetAtt ScheduledScoreFunctionRole.Arn
      Events:
        HourlyScoreRule:
          Type: Schedule
          Properties:
            Schedule: 'rate(1 hour)'

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/presign/
      Handler: app.lambda_handler
      Role: !GetAtt PresignFunctionRole.Arn
      Events:
        PresignApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/uploads/presign
            Method: POST

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/analyze/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: 5
      Role: !GetAtt AnalyzeFunctionRole.Arn
      Events:
        AnalyzeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/analyze
            Method: POST

  TenderClauseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/tender_clause/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: 5
      Role: !GetAtt TenderClauseFunctionRole.Arn
      Events:
        TenderClauseApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/tender/clause
            Method: POST

  CasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/cases/
      Handler: app.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref EscalationStateMachine
      Role: !GetAtt CasesFunctionRole.Arn
      Events:
        CreateCaseApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases
            Method: POST
        ListCasesApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases
            Method: GET
        GetCaseApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases/{case_id}
            Method: GET

  ClaimFixFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/claim_fix/
      Handler: app.handler
      ReservedConcurrentExecutions: 5
      Role: !GetAtt ClaimFixFunctionRole.Arn
      Events:
        ClaimFixApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases/{case_id}/claim-fix
            Method: POST

  RegisterTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/sfn_register_token/
      Handler: app.lambda_handler
      Role: !GetAtt RegisterTokenFunctionRole.Arn
  MarkClosedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/sfn_mark_closed/
      Handler: app.lambda_handler
      Role: !GetAtt MarkClosedFunctionRole.Arn
  NoticeAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/sfn_notice_agent/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: 5
      Timeout: 60
      MemorySize: 1024
      Role: !GetAtt NoticeAgentFunctionRole.Arn
  EscalationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/escalation.asl.json
      DefinitionSubstitutions:
        NoticeAgentFunctionArn: !GetAtt NoticeAgentFunction.Arn
        RegisterTokenFunctionArn: !GetAtt RegisterTokenFunction.Arn
        MarkClosedFunctionArn: !GetAtt MarkClosedFunction.Arn
      Role: !GetAtt EscalationStateMachineRole.Arn
  # Explicit roles use reviewed Autopilot actions with exact runtime resources.
  HealthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RuntimeAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-HealthFunction-*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-HealthFunction-*:log-stream:*
  HotspotsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RuntimeAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-HotspotsFunction-*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-HotspotsFunction-*:log-stream:*
  RiskFunctionRole:
