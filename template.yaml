            Resource:
            - Fn::Sub: ${StorageBucket.Arn}/uploads/*
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-lite-v1:0
          - Effect: Allow
            Action:
            - states:SendTaskSuccess
            - states:SendTaskFailure
