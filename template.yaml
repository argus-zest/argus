            - logs:CreateLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-RiskFunction-*
          - Effect: Allow
