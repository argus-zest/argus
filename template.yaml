      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RuntimeAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-RegisterTokenFunction-*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-RegisterTokenFunction-*:log-stream:*
          - Effect: Allow
            Action:
            - dynamodb:UpdateItem
