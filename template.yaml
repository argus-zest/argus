    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RuntimeAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
