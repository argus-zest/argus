            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-MarkClosedFunction-*:log-stream:*
          - Effect: Allow
            Action:
            - dynamodb:UpdateItem
            Resource:
            - Fn::GetAtt:
              - CasesTable
              - Arn
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            Resource:
            - Fn::GetAtt:
              - CaseEventsTable
              - Arn
  NoticeAgentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RuntimeAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-NoticeAgentFunction-*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-NoticeAgentFunction-*:log-stream:*
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            Resource:
            - Fn::GetAtt:
              - CasesTable
              - Arn
          - Effect: Allow
            Action:
            - dynamodb:Query
            - dynamodb:PutItem
            Resource:
            - Fn::GetAtt:
              - CaseEventsTable
              - Arn
          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
            - Fn::Sub: ${StorageBucket.Arn}/uploads/*
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-lite-v1:0
          - Effect: Allow
            Action:
            - ses:SendEmail
            Resource:
            - Fn::Sub: arn:aws:ses:ap-southeast-2:${AWS::AccountId}:identity/${SesFrom}
            Condition:
              StringEquals:
                ses:FromAddress:
                  Ref: SesFrom
              ForAllValues:StringEquals:
                ses:Recipients:
                - Ref: DryRunInbox
              'Null':
                ses:Recipients: 'false'
  EscalationStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:aws:states:ap-southeast-2:${AWS::AccountId}:stateMachine:EscalationStateMachine-*
      Policies:
      - PolicyName: WorkflowInvocations
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - NoticeAgentFunction
              - Arn
            - Fn::GetAtt:
              - RegisterTokenFunction
              - Arn
            - Fn::GetAtt:
              - MarkClosedFunction
              - Arn

Outputs:
  ApiBase:
    Description: Base URL for HTTP API v1 endpoints
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  BucketName:
    Description: S3 Storage Bucket
    Value: !Ref StorageBucket
  StateMachineArn:
    Description: Escalation State Machine ARN
    Value: !Ref EscalationStateMachine
  TableNames:
    Description: DynamoDB Table Names
    Value: !Sub '${AssetsTable}, ${CasesTable}, ${CaseEventsTable}'

  AssetsTableName:
    Description: Civic assets DynamoDB table
    Value: !Ref AssetsTable
  CasesTableName:
    Description: Cases DynamoDB table
    Value: !Ref CasesTable
  CaseEventsTableName:
    Description: Case history DynamoDB table
    Value: !Ref CaseEventsTable
