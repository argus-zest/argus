            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-AssetsFunction-*:log-stream:*
          - Effect: Allow
            Action:
            - dynamodb:Scan
            Resource:
            - Fn::GetAtt:
              - AssetsTable
