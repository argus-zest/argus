          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
            - Fn::Sub: ${StorageBucket.Arn}/tenders/*
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-lite-v1:0
  CasesFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
