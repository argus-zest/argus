AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Argus — Delhi Street Hazard Intelligence & Civic Accountability Platform

Parameters:
  FrontendOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Allowed origin for CORS
  SesFrom:
    Type: String
    Default: 'noreply@example.com'
    Description: Verified SES email identity for sending notices
  DryRunInbox:
    Type: String
    Default: 'dryrun@example.com'
    Description: Verified SES email identity for receiving dry-run notices
  NovaModelId:
    Type: String
    Default: 'global.amazon.nova-2-lite-v1:0'
    Description: Amazon Bedrock Nova 2 Lite model ID
  EnableTomtom:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable optional TomTom traffic integration
  TomtomApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional API key for TomTom flow segment data

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 15
    MemorySize: 512
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        TABLE_ASSETS: !Ref AssetsTable
        TABLE_CASES: !Ref CasesTable
        TABLE_EVENTS: !Ref CaseEventsTable
        BUCKET: !Ref StorageBucket
        NOVA_MODEL_ID: !Ref NovaModelId
        SES_FROM: !Ref SesFrom
        DRYRUN_INBOX: !Ref DryRunInbox
        USE_MOCKS: 'false'
        ENABLE_TOMTOM: !Ref EnableTomtom
        TOMTOM_API_KEY: !Ref TomtomApiKey

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - 'http://localhost:5173'
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 3000
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: argus-shared-layer
      Description: Shared Python modules and civic datasets
      ContentUri: backend/layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  StorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Prefix: uploads/
            Status: Enabled
            ExpirationInDays: 14
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - !Ref FrontendOrigin
              - 'http://localhost:5173'
            MaxAge: 3000

  AssetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-Assets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: asset_id
          AttributeType: S
      KeySchema:
        - AttributeName: asset_id
          KeyType: HASH

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-Cases'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
      KeySchema:
        - AttributeName: case_id
          KeyType: HASH

  CaseEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-CaseEvents'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
        - AttributeName: ts_seq
          AttributeType: S
      KeySchema:
        - AttributeName: case_id
          KeyType: HASH
        - AttributeName: ts_seq
          KeyType: RANGE

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/health/
      Handler: app.handler
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/health
            Method: GET

  HotspotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/hotspots/
      Handler: app.handler
      Events:
        HotspotsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/hotspots
            Method: GET
        ResolveApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/resolve
            Method: POST

  RiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/risk/
      Handler: app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
      Events:
        RiskApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/risk
            Method: GET

  AssetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/assets/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AssetsTable
      Events:
        AssetsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/assets
            Method: GET

  EvalResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/eval_results/
      Handler: app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
      Events:
        EvalResultsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/eval/results
            Method: GET

  ScheduledScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/scheduled_score/
      Handler: app.handler
      Timeout: 60
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
      Events:
        HourlyScoreRule:
          Type: Schedule
          Properties:
            Schedule: 'rate(1 hour)'

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/presign/
      Handler: app.lambda_handler
      Policies:
        - S3WritePolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
      Events:
        PresignApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/uploads/presign
            Method: POST

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/analyze/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: 5
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0'
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0'
      Events:
        AnalyzeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/analyze
            Method: POST

  TenderClauseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/tender_clause/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: 5
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0'
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0'
      Events:
        TenderClauseApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/tender/clause
            Method: POST

  CasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/cases/
      Handler: app.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref EscalationStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseEventsTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt EscalationStateMachine.Name
      Events:
        CreateCaseApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases
            Method: POST
        ListCasesApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases
            Method: GET
        GetCaseApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases/{case_id}
            Method: GET

  ClaimFixFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/claim_fix/
      Handler: app.handler
      ReservedConcurrentExecutions: 5
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseEventsTable
        - S3ReadPolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
        - Statement:
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: '*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0'
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0'
      Events:
        ClaimFixApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/cases/{case_id}/claim-fix
            Method: POST

  RegisterTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/sfn_register_token/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable

  MarkClosedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/sfn_mark_closed/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseEventsTable

  NoticeAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/functions/sfn_notice_agent/
      Handler: app.lambda_handler
      ReservedConcurrentExecutions: 5
      Timeout: 60
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseEventsTable
        - S3ReadPolicy:
            BucketName: !Sub 'argus-${AWS::AccountId}-us-east-1'
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: !Sub 'arn:aws:ses:us-east-1:${AWS::AccountId}:identity/*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0'
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0'

  EscalationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/escalation.asl.json
      DefinitionSubstitutions:
        NoticeAgentFunctionArn: !GetAtt NoticeAgentFunction.Arn
        RegisterTokenFunctionArn: !GetAtt RegisterTokenFunction.Arn
        MarkClosedFunctionArn: !GetAtt MarkClosedFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref NoticeAgentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RegisterTokenFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MarkClosedFunction

Outputs:
  ApiBase:
    Description: Base URL for HTTP API v1 endpoints
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  BucketName:
    Description: S3 Storage Bucket
    Value: !Ref StorageBucket
  StateMachineArn:
    Description: Escalation State Machine ARN
    Value: !Ref EscalationStateMachine
  TableNames:
    Description: DynamoDB Table Names
    Value: !Sub '${AssetsTable}, ${CasesTable}, ${CaseEventsTable}'

