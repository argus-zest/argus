          Action: sts:AssumeRole
      Policies:
      - PolicyName: RuntimeAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-EvalResultsFunction-*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub: arn:aws:logs:ap-southeast-2:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-EvalResultsFunction-*:log-stream:*
          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
