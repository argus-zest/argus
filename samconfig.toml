version = 0.1

[default]
[default.global.parameters]
stack_name = "argus"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
profile = "hackathon"
parameter_overrides = [
    "FrontendOrigin=\"http://localhost:5173\"",
    "SesFrom=\"noreply@example.com\"",
    "DryRunInbox=\"dryrun@example.com\"",
    "NovaModelId=\"global.amazon.nova-2-lite-v1:0\"",
    "EnableTomtom=\"false\"",
    "TomtomApiKey=\"\""
]
